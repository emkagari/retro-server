# The Retro client's data server (client/config.xml): /dofus149/lang/ and
# /dofus149/maps/ from data/. A file not found here (404) is loaded from the
# client's own data/, the next server in its list.
server {
    listen 80;
    server_name localhost;
    sendfile on;

    location ^~ /dofus149/ {
        alias /srv/data/;
    }
}
