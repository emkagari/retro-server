# The game server's configuration. "key = value", unlike the login's ("key value"):
# the two servers don't share their config reader. __DB_PASSWORD__ comes from .env.

# --- Server ---
# id and key must match aegnor_login.servers (the kit's row: 2, 'Aegnor', 'aegnor'),
# or the login silently refuses this server.
server.id = 2
server.key = aegnor
# The address the login gives clients, not a bind address: 127.0.0.1 for a
# player on this machine; this machine's address for players on the network.
server.host = 127.0.0.1
server.name = Aegnor
server.version = 1.49.6
server.port = 5555

# --- Link to the login ---
exchange.host = login
exchange.port = 6667

# --- Databases ---
database.login.host = mariadb
database.login.port = 3306
database.login.user = root
database.login.pass = __DB_PASSWORD__
database.login.name = aegnor_login

database.game.host = mariadb
database.game.port = 3306
database.game.user = root
database.game.pass = __DB_PASSWORD__
database.game.name = aegnor_game

# The Azuriom CMS database: read only with mode.azuriom = true.
database.site.host = mariadb
database.site.port = 3306
database.site.user = root
database.site.pass = __DB_PASSWORD__
database.site.name = aegnor_web

