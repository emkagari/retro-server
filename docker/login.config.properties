# The login server's configuration. "key value", unlike the game's ("key = value").
# __DB_PASSWORD__ comes from .env.

# The game server connects here: the login is the side that listens.
system.server.exchange.ip 0.0.0.0
system.server.exchange.port 6667
system.server.login.ip 0.0.0.0
system.server.login.port 1135
# The client version accepted (with or without the Electron client's "e").
system.server.login.version 1.49.6
system.server.onlyadmin false

# mariadb: the Compose service.
database.login.host mariadb
database.login.port 3306
database.login.user root
database.login.pass __DB_PASSWORD__
database.login.name aegnor_login

web.url http://127.0.0.1/ip.txt
