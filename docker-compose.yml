# Aegnor for the Retro client: the database, the login and game servers, and
# the client's data server.
# `cp .env.example .env`, then `docker compose up -d`.
services:
  # The kit's database dumps, downloaded once into db-init/dumps.
  db-dumps:
    image: alpine:3.20
    volumes:
      - ./db-init/dumps:/dumps
    command:
      - sh
      - -c
      - |
        set -e
        cd /dumps
        if [ -s aegnor_game.sql ] && [ -s aegnor_login.sql ] && [ -s aegnor_web.sql ]; then exit 0; fi
        echo "downloading the kit's database (54 MB)..."
        wget -q -O /tmp/db.zip https://github.com/jguyet/kit-1.43.7/raw/main/db-1.43.7.zip
        unzip -o -j /tmp/db.zip 'db-1.43.7/*.sql' -d /dumps
        # Written as root: left removable by anyone (Linux hosts).
        chmod -R a+rwX /dumps
        ls -l /dumps

  mariadb:
    image: mariadb:11.3
    restart: unless-stopped
    depends_on:
      db-dumps: { condition: service_completed_successfully }
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD missing, copy .env.example to .env}"
    ports: ["127.0.0.1:${DB_PORT:-3306}:3306"]
    volumes:
      - db:/var/lib/mysql
      # Run once, when the volume is created: a few minutes (226 MB of SQL).
      - ./db-init/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s

  login:
    build: { context: ., dockerfile: docker/login.Dockerfile }
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
    ports: ["${LOGIN_PORT:-1135}:1135"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/login.config.properties:/app/config.template:ro
    # The login's console reads stdin in a loop that swallows end-of-file: with
    # stdin closed it spins at 100 % of a core. Open (and a terminal), it blocks
    # as intended, and `docker compose attach login` gives the console.
    stdin_open: true
    tty: true

  game:
    build: { context: ., dockerfile: docker/game.Dockerfile }
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
      login: { condition: service_started }
    ports: ["${GAME_PORT:-5555}:5555"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/game.config.properties:/app/config.template:ro
    # Like the login: a console that never sees end-of-file.
    stdin_open: true
    tty: true

  # The client's data server: the 1.49.6 lang files with this server's world,
  # and the maps the 1.49.6 client lacks (data/, docker/weblang.conf).
  weblang:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${LANG_PORT:-4545}:80"]
    volumes:
      - ./docker/weblang.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/srv/data:ro

volumes:
  db:
